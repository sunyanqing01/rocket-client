[package]
name = "rocket-gui"
version = "1.0.5"
description = "Rocket Client - SSL VPN client"
authors = ["rocket-gui"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "rocket_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-single-instance = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
wintun = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tun = "0.6"
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
