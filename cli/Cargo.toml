[package]
name = "rocket-cli"
version = "0.2.0"
edition = "2021"
description = "Minimal SSL-VPN client (SecoClient/UniVPN compatible) with SOCKS5 proxy"

[dependencies]
native-tls = "0.2"
wintun = "0.4"
ctrlc = "3"
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
